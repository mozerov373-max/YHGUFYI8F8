name: AES scanner

on:
  schedule:
    # Барнаул = UTC+7. Старт 13:30 Барнаул = 06:30 UTC.
    # Запускаем заранее + запасные, т.к. GitHub часто опаздывает. Дубли не страшны (concurrency).
    - cron: '30 5 * * 1-5'   # 12:30 Барнаул
    - cron: '50 5 * * 1-5'   # 12:50
    - cron: '10 6 * * 1-5'   # 13:10
    - cron: '25 6 * * 1-5'   # 13:25
  workflow_dispatch:

concurrency:
  group: aes-scanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: aes-state-${{ github.run_id }}
          restore-keys: aes-state-

      - name: Run scanner
        env:
          TWELVE_DATA_KEY: ${{ secrets.TWELVE_DATA_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ACCOUNT_BALANCE: ${{ vars.ACCOUNT_BALANCE }}
          TD_DXY_SYMBOL: ${{ vars.TD_DXY_SYMBOL }}
        run: python -u scanner.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: aes-state-${{ github.run_id }}
